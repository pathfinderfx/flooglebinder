<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flooglebinder Ltd - FX Command Centre</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0b111e; color:#e2e8f0; font-family:'DM Sans',sans-serif; min-height:100vh; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:#0f172a; }
::-webkit-scrollbar-thumb { background:#334155; border-radius:3px; }
.mono { font-family:'DM Mono',monospace; }
#app { max-width:1200px; margin:0 auto; padding:24px 28px; }
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:14px; }
.card { background:linear-gradient(145deg,#1a2332,#141d2b); border-radius:12px; border:1px solid #ffffff08; }
.kpi-card { padding:14px; }
.kpi-label { font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:1.2px; font-family:'DM Mono',monospace; margin-bottom:6px; }
.kpi-value { font-size:22px; font-weight:700; }
.kpi-sub { font-size:11px; margin-top:2px; font-weight:500; }
.tabs { display:flex; gap:2px; background:#1e293b; border-radius:8px; padding:3px; overflow-x:auto; flex:1; }
.tab { padding:7px 14px; border-radius:6px; border:none; cursor:pointer; font-size:12px; font-weight:500; font-family:'DM Sans',sans-serif; white-space:nowrap; background:transparent; color:#94a3b8; }
.tab.active { background:#38bdf8; color:#0b111e; }
.tabs-bar { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
.settled-toggle { padding:6px 12px; border-radius:6px; border:1px solid #334155; background:transparent; color:#64748b; font-size:11px; font-weight:500; cursor:pointer; font-family:'DM Sans',sans-serif; white-space:nowrap; transition:all 0.15s; }
.settled-toggle.active { background:#22c55e18; border-color:#22c55e40; color:#22c55e; }
.supplier-row { margin-bottom:8px; }
.supplier-header { padding:12px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
.supplier-detail { border-top:1px solid #ffffff08; padding:0 14px 12px; overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { padding:8px 6px; text-align:left; border-bottom:1px solid #ffffff10; font-weight:500; font-size:10px; color:#475569; text-transform:uppercase; letter-spacing:1px; }
td { padding:8px 6px; border-bottom:1px solid #ffffff06; }
.badge { padding:2px 6px; border-radius:3px; font-size:10px; font-weight:600; white-space:nowrap; }
.coverage-bar { height:18px; border-radius:9px; background:#0f172a; display:flex; overflow:hidden; margin:6px 0; }
.alert-box { background:#f59e0b10; border:1px solid #f59e0b25; border-radius:8px; padding:10px 14px; margin-bottom:14px; }
.login-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:24px; }
.login-box { background:linear-gradient(145deg,#1a2332,#141d2b); border:1px solid #ffffff08; border-radius:12px; padding:28px 32px; width:100%; max-width:360px; }
.login-input { width:100%; padding:8px 12px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; font-size:13px; font-family:'DM Sans',sans-serif; outline:none; }
.login-btn { width:100%; padding:10px; border-radius:6px; border:none; background:#38bdf8; color:#0b111e; font-size:13px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; }
.edit-btn { padding:3px 8px; border-radius:4px; border:1px solid #334155; background:transparent; color:#64748b; font-size:10px; cursor:pointer; white-space:nowrap; font-family:'DM Sans',sans-serif; }
.edit-btn:hover { border-color:#38bdf8; color:#38bdf8; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.open { display:flex; }
.modal-box { background:linear-gradient(145deg,#1a2332,#141d2b); border:1px solid #334155; border-radius:14px; padding:24px; width:100%; max-width:440px; }
.modal-label { font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:6px; font-family:'DM Mono',monospace; }
.modal-input { width:100%; padding:8px 10px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; font-size:13px; font-family:'DM Sans',sans-serif; outline:none; }
.modal-input:focus { border-color:#38bdf8; }
.modal-select { width:100%; padding:8px 10px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; font-size:13px; font-family:'DM Sans',sans-serif; outline:none; }
.modal-select:focus { border-color:#38bdf8; }
.log-change-pill { display:inline-block; padding:2px 7px; border-radius:4px; font-size:10px; font-family:'DM Mono',monospace; background:#1e293b; color:#94a3b8; margin:1px 0; white-space:nowrap; }
.log-change-pill .arrow { color:#475569; margin:0 3px; }
.log-change-pill .to-val { color:#38bdf8; font-weight:500; }
</style>
</head>
<body>

<script>
var SB_URL = "https://mkviozvkuvsdmusexbcv.supabase.co";
var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rdmlvenZrdXZzZG11c2V4YmN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTk2MzksImV4cCI6MjA5MzY3NTYzOX0.2DPSkw3LLrTsoUvzBPry36j-mfwwHihtiZps7CWSAu4";

// ── SPOT RATES ────────────────────────────────────────────────────────────
var SPOT = { EUR: 1.1483, USD: 1.356, ZAR: 22.19, THB: 43.3 };
var SPOT_UPDATED = null;
var SPOT_STALE = false;

function fetchSpotRates() {
  return fetch("https://open.er-api.com/v6/latest/GBP")
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.result === "success") {
        SPOT.EUR = data.rates.EUR;
        SPOT.USD = data.rates.USD;
        SPOT.ZAR = data.rates.ZAR;
        SPOT.THB = data.rates.THB;
        SPOT_UPDATED = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
        SPOT_STALE = false;
      }
    })
    .catch(function(e) {
      console.warn("Spot rate fetch failed — using last known values:", e);
      SPOT_STALE = true;
    });
}
// ─────────────────────────────────────────────────────────────────────────

// ── SETTLED TOGGLE ────────────────────────────────────────────────────────
// Default: hide settled. Persists for the session.
var hideSettled = sessionStorage.getItem("hideSettled") !== "false";

function toggleSettled() {
  hideSettled = !hideSettled;
  sessionStorage.setItem("hideSettled", hideSettled ? "true" : "false");
  render();
}
// ─────────────────────────────────────────────────────────────────────────

var TODAY = new Date();
var SUPPLIERS = [];
var CHANGE_LOG = null;
var activeTab = "overview";
var openSupp = null;
var budgets = {EUR:1.16, USD:1.30, ZAR:23.0, THB:44.0};
var CURRENT_USER = "";
var EDIT_TARGET = null;

var HEDGED_STATUSES  = ["fwd_secured","funded","deposit_received","payment_instructed"];
var SETTLED_STATUSES = ["settled"];

var ST = {
  settled:            {label:"Settled",         color:"#22c55e", bg:"#16a34a18"},
  fwd_secured:        {label:"FWD Secured",      color:"#f59e0b", bg:"#d9770618"},
  funded:             {label:"Funded",           color:"#38bdf8", bg:"#0284c718"},
  deposit_received:   {label:"Deposit Received", color:"#818cf8", bg:"#6366f118"},
  payment_instructed: {label:"Instructed",       color:"#a78bfa", bg:"#7c3aed18"},
  unhedged:           {label:"Unhedged",         color:"#ef4444", bg:"#dc262618"}
};

function isHedged(s)  { return HEDGED_STATUSES.indexOf(s) >= 0; }
function isSettled(s) { return SETTLED_STATUSES.indexOf(s) >= 0; }

// Returns true if this payment should be visible given current filter
function isVisible(status) {
  return !hideSettled || !isSettled(status);
}

// ── AUTH HELPERS ──────────────────────────────────────────────────────────

function getToken()  { return sessionStorage.getItem("sb_token"); }
function getRtoken() { return sessionStorage.getItem("sb_refresh"); }

function refreshSession() {
  var rt = getRtoken();
  if (!rt) return Promise.reject(new Error("No refresh token — please sign in again."));
  return fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {
    method: "POST",
    headers: {"apikey": SB_KEY, "Content-Type": "application/json"},
    body: JSON.stringify({refresh_token: rt})
  }).then(function(r){ return r.json(); }).then(function(d) {
    if (d.access_token) {
      sessionStorage.setItem("sb_token",   d.access_token);
      sessionStorage.setItem("sb_refresh", d.refresh_token);
      return d.access_token;
    }
    throw new Error("Session refresh failed — please sign in again.");
  });
}

function sbFetch(path) {
  return fetch(SB_URL + "/rest/v1/" + path, {
    headers: {"apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY}
  }).then(function(r){ return r.json(); });
}

function sbWrite(method, path, body) {
  var token = getToken();
  return fetch(SB_URL + "/rest/v1/" + path, {
    method: method,
    headers: {
      "apikey":        SB_KEY,
      "Authorization": "Bearer " + (token || SB_KEY),
      "Content-Type":  "application/json",
      "Prefer":        "return=minimal"
    },
    body: JSON.stringify(body)
  }).then(function(r) {
    if (r.status === 401 || r.status === 403) {
      return r.json().then(function(errBody) {
        var msg = (errBody && errBody.message) || "";
        if (msg.indexOf("JWT expired") >= 0 || msg.indexOf("expired") >= 0) {
          return refreshSession().then(function(newToken) {
            return fetch(SB_URL + "/rest/v1/" + path, {
              method: method,
              headers: {
                "apikey":        SB_KEY,
                "Authorization": "Bearer " + newToken,
                "Content-Type":  "application/json",
                "Prefer":        "return=minimal"
              },
              body: JSON.stringify(body)
            });
          }).catch(function() {
            sessionStorage.removeItem("sb_token");
            sessionStorage.removeItem("sb_refresh");
            alert("Your session has expired. Please sign in again.");
            location.reload();
          });
        }
        return {ok: false, _errMsg: msg || JSON.stringify(errBody)};
      });
    }
    return r;
  });
}

// ── CHANGE LOG ────────────────────────────────────────────────────────────

function loadChangeLog() {
  return sbFetch("change_log?order=created_at.desc&limit=500")
    .then(function(rows) {
      CHANGE_LOG = Array.isArray(rows) ? rows : [];
    })
    .catch(function(e) {
      console.warn("Could not load change log:", e);
      CHANGE_LOG = [];
    });
}

function buildPaymentMap() {
  var map = {};
  SUPPLIERS.forEach(function(s) {
    s.payments.forEach(function(p) {
      map[p.id] = { supplier: s.name, ref: p.ref, ccy: s.ccy };
    });
  });
  return map;
}

var CHANGE_FIELD_LABELS = { status: "Status", fcy_amount: "Amount", due_date: "Due Date" };

function formatChangeVal(field, val) {
  if (val === null || val === undefined || val === "") return "none";
  if (field === "status") return ST[val] ? ST[val].label : val;
  if (field === "due_date") return val ? fmtDate(val) : "TBC";
  return String(val);
}

function renderChangePills(changes) {
  if (!changes || typeof changes !== "object") return '<span style="color:#475569;font-size:11px">Note only</span>';
  var keys = Object.keys(changes);
  if (keys.length === 0) return '<span style="color:#475569;font-size:11px">Note only</span>';
  return keys.map(function(k) {
    var c = changes[k];
    var label = CHANGE_FIELD_LABELS[k] || k;
    var from  = formatChangeVal(k, c.from);
    var to    = formatChangeVal(k, c.to);
    return '<span class="log-change-pill">'+label+': <span style="color:#64748b">'+from+'</span><span class="arrow">→</span><span class="to-val">'+to+'</span></span>';
  }).join(" ");
}

// ── FORMATTING ────────────────────────────────────────────────────────────

function fmt(n)      { return n != null ? n.toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2}) : "--"; }
function fmtD(n, d)  { d=d||2; return n != null ? n.toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d}) : "--"; }
function fmtDate(d)  { if (!d||d==="TBC") return "TBC"; return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"2-digit"}); }
function fmtDateTime(ts) {
  if (!ts) return "--";
  var dt = new Date(ts);
  return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"2-digit"}) +
    " " + dt.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
}
function daysUntil(d){ if (!d||d==="TBC") return Infinity; return Math.ceil((new Date(d)-TODAY)/86400000); }
function gbpVal(fcy,rate,ccy){ return fcy/(rate||SPOT[ccy]); }

// ── DATA ──────────────────────────────────────────────────────────────────

function buildSuppliers(sRows, pRows) {
  return sRows.map(function(s) {
    return {
      id: s.id, name: s.name, ccy: s.currency, pair: s.ccy_pair,
      payments: pRows.filter(function(p){ return p.supplier_id===s.id; }).map(function(p) {
        var type = p.payment_type || "--";
        if (p.payment_pct) type = type.charAt(0).toUpperCase()+type.slice(1)+" "+p.payment_pct+"%";
        return {
          id:       p.id,
          ref:      p.invoice_refs    || "--",
          type:     type,
          fcyAmt:   parseFloat(p.fcy_amount)  || 0,
          rate:     p.forward_rate    ? parseFloat(p.forward_rate) : null,
          status:   p.status          || "unhedged",
          due:      p.due_date        || "TBC",
          fwd:      p.trade_id        || null,
          dep:      p.security_dep    ? parseFloat(p.security_dep) : null,
          depDue:   p.security_dep_due|| null,
          ccPayRef: p.cc_pay_ref      || null,
          notes:    p.notes           || null
        };
      })
    };
  }).filter(function(s){ return s.payments.length>0; });
}

function calcData() {
  var tG=0,sG=0,fG=0,uG=0,tPay=0;
  var cc={},upcoming=[],deps=[],mats=[],cf={};
  SUPPLIERS.forEach(function(s) {
    s.payments.forEach(function(p) {
      // Respect hideSettled filter throughout all calculations
      if (!isVisible(p.status)) return;

      var g=gbpVal(p.fcyAmt,p.rate,s.ccy); tG+=g; tPay++;
      if (!cc[s.ccy]) cc[s.ccy]={total:0,settled:0,fwd:0,unhedged:0,rates:[]};
      cc[s.ccy].total+=g;
      if (p.rate) cc[s.ccy].rates.push({rate:p.rate,gbp:g});
      if (isSettled(p.status))     { sG+=g; cc[s.ccy].settled+=g; }
      else if (isHedged(p.status)) { fG+=g; cc[s.ccy].fwd+=g; }
      else                         { uG+=g; cc[s.ccy].unhedged+=g; }
      if (!isSettled(p.status)) upcoming.push(Object.assign({},p,{supplier:s.name,ccy:s.ccy}));
      if (p.dep) deps.push({supplier:s.name,ref:p.ref,amount:p.dep,due:p.depDue,paid:daysUntil(p.depDue)<0});
      if (isHedged(p.status)) { var d=daysUntil(p.due); if (d<=30&&d>=0) mats.push(Object.assign({},p,{supplier:s.name,ccy:s.ccy,days:d})); }
      var m=p.due&&p.due!=="TBC"?p.due.substring(0,7):null;
      if (m&&!isSettled(p.status)) cf[m]=(cf[m]||0)+g;
    });
  });
  upcoming.sort(function(a,b){ return daysUntil(a.due)-daysUntil(b.due); });
  mats.sort(function(a,b){ return a.days-b.days; });
  var wavg={};
  Object.keys(cc).forEach(function(c) {
    var d=cc[c];
    if (d.rates.length) { var tw=d.rates.reduce(function(a,r){ return a+r.gbp; },0); wavg[c]=d.rates.reduce(function(a,r){ return a+r.rate*(r.gbp/tw); },0); }
  });
  return {tG:tG,sG:sG,fG:fG,uG:uG,tPay:tPay,cc:cc,upcoming:upcoming,deps:deps,mats:mats,cf:cf,wavg:wavg};
}

// ── EDIT MODAL ────────────────────────────────────────────────────────────

function editPayment(id, supplier, ref, ccy, status, amount, due) {
  EDIT_TARGET={id:id,supplier:supplier,ref:ref,ccy:ccy,oldStatus:status,oldAmount:amount,oldDue:due};
  document.getElementById("modal-title").textContent   = supplier+" — "+ref;
  document.getElementById("modal-sub").textContent     = "Edit payment details";
  document.getElementById("edit-status").value         = status;
  document.getElementById("edit-ccy-label").textContent= ccy;
  document.getElementById("edit-amount").value         = amount;
  document.getElementById("edit-due").value            = (due&&due!=="TBC")?due:"";
  document.getElementById("edit-note").value           = "";
  document.getElementById("edit-user").textContent     = CURRENT_USER||"unknown";
  document.getElementById("modal-err").style.display   = "none";
  document.getElementById("modal-save-btn").textContent= "Save Changes";
  document.getElementById("modal-save-btn").disabled   = false;
  document.getElementById("edit-modal").classList.add("open");
}

function closeModal() {
  document.getElementById("edit-modal").classList.remove("open");
  EDIT_TARGET=null;
}

document.getElementById("edit-modal").addEventListener("click",function(e){ if(e.target===this) closeModal(); });

function saveEdit() {
  if (!EDIT_TARGET) return;
  var newStatus = document.getElementById("edit-status").value;
  var newAmount = parseFloat(document.getElementById("edit-amount").value);
  var newDue    = document.getElementById("edit-due").value || null;
  var note      = document.getElementById("edit-note").value.trim() || null;
  var btn       = document.getElementById("modal-save-btn");
  var err       = document.getElementById("modal-err");

  var patch={}, changes={};
  if (newStatus!==EDIT_TARGET.oldStatus)  { patch.status=newStatus;    changes.status={from:EDIT_TARGET.oldStatus,to:newStatus}; }
  if (newAmount!==EDIT_TARGET.oldAmount)  { patch.fcy_amount=newAmount; changes.fcy_amount={from:EDIT_TARGET.oldAmount,to:newAmount}; }
  if (newDue!==EDIT_TARGET.oldDue)        { patch.due_date=newDue;      changes.due_date={from:EDIT_TARGET.oldDue,to:newDue}; }

  if (Object.keys(patch).length===0 && !note) { closeModal(); return; }
  patch.updated_at = new Date().toISOString();

  btn.textContent="Saving..."; btn.disabled=true; err.style.display="none";

  var patchPromise = Object.keys(patch).length > 1
    ? sbWrite("PATCH","payments?id=eq."+EDIT_TARGET.id, patch)
    : Promise.resolve({ok:true});

  var logPromise = sbWrite("POST","change_log",{
    payment_id: EDIT_TARGET.id,
    changed_by: CURRENT_USER||"unknown",
    changes:    changes,
    note:       note
  });

  Promise.all([patchPromise, logPromise]).then(function(results) {
    var failures = results.filter(function(r){ return r && r.ok===false; });
    if (failures.length>0) {
      var msg = failures[0]._errMsg || "Save failed — check Supabase logs.";
      throw new Error(msg);
    }
    SUPPLIERS.forEach(function(s) {
      s.payments.forEach(function(p) {
        if (p.id===EDIT_TARGET.id) {
          if (patch.status)     p.status=newStatus;
          if (patch.fcy_amount) p.fcyAmt=newAmount;
          if ("due_date" in patch) p.due=newDue||"TBC";
        }
      });
    });
    CHANGE_LOG = null;
    closeModal(); render();
  }).catch(function(e) {
    err.textContent   = e.message||"Save failed. Please try again.";
    err.style.display = "block";
    btn.textContent   = "Save Changes";
    btn.disabled      = false;
  });
}

function renderTab(d,pS,pF,pU,totDep,bPnl) {

    rows+='<td class="mono" style="text-align:right;font-weight:600">GBP '+fmt(gDue)+(p.status==="deposit_received"?'<div style="font-size:9px;color:#818cf8;font-weight:400">net of 5% dep</div>':'')+'</td>';
    rows+='<td class="mono">'+fmtDate(p.due)+'</td>';
    rows+='<td><span class="badge" style="background:'+st.bg+';color:'+st.color+'">'+st.label+'</span></td>';
    rows+='<td>'+editBtn(p,p.ccy)+'</td></tr>';
  });
  var depRows="";
  d.deps.forEach(function(m){
    depRows+='<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#0f172a;border-radius:6px;margin-bottom:6px">';
    depRows+='<div style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:'+(m.paid?"#22c55e":"#f59e0b")+';display:inline-block"></span>';
    depRows+='<span style="font-size:12px;font-weight:500">'+m.supplier+'</span><span style="font-size:11px;color:#64748b">'+m.ref+'</span></div>';
    depRows+='<div style="display:flex;align-items:center;gap:10px"><span class="mono" style="font-size:12px;font-weight:600">GBP '+fmt(m.amount)+'</span>';
    depRows+='<span style="font-size:10px;color:'+(m.paid?"#22c55e":"#f59e0b")+'">'+(m.paid?"Paid":"Due "+fmtDate(m.due))+'</span></div></div>';
  });
  var html='<div style="display:grid;gap:14px">';
  html+='<div class="card" style="overflow:hidden"><div style="padding:14px 16px;border-bottom:1px solid #ffffff08;display:flex;justify-content:space-between;align-items:center">';
  html+='<div style="font-size:14px;font-weight:600">Upcoming Payments and Maturities</div>';
  html+='<div style="font-size:10px;color:#818cf8;font-style:italic">GBP Due is net of 5% margin for Deposit Received rows</div></div>';
  html+='<div style="overflow-x:auto"><table style="min-width:660px"><thead><tr>';
  html+='<th>Days</th><th>Supplier</th><th>Ref</th><th>Type</th><th style="text-align:right">FCY</th><th style="text-align:right">GBP Due</th><th>Due</th><th>Status</th><th></th>';
  html+='</tr></thead><tbody>'+(rows||'<tr><td colspan="9" style="color:#475569;text-align:center;padding:20px">No upcoming payments</td></tr>')+'</tbody></table></div></div>';
  html+='<div class="card" style="padding:16px"><div style="font-size:14px;font-weight:600;margin-bottom:4px">5% Margin Deposit Tracker</div>';
  html+='<div style="font-size:11px;color:#64748b;margin-bottom:10px">Total margin held: <strong style="color:#818cf8">GBP '+fmt(totDep)+'</strong></div>';
  html+=(depRows||'<div style="font-size:12px;color:#475569">No deposits recorded</div>')+'</div></div>';
  return html;
}

function renderCashflow(d) {
  var months=Object.keys(d.cf).sort(),vals=months.map(function(m){ return d.cf[m]; }),maxV=Math.max.apply(null,vals)||1,bars="";
  months.forEach(function(m){
    var v=d.cf[m];
    bars+='<div style="margin-bottom:10px">';
    bars+='<div style="display:flex;justify-content:space-between;margin-bottom:4px">';
    bars+='<span style="font-size:12px;font-weight:500">'+new Date(m+"-01").toLocaleDateString("en-GB",{month:"long",year:"numeric"})+'</span>';
    bars+='<span class="mono" style="font-size:13px;font-weight:700">GBP '+fmt(v)+'</span></div>';
    bars+='<div style="height:16px;border-radius:4px;background:#0f172a;overflow:hidden"><div style="height:100%;width:'+(v/maxV*100)+'%;background:linear-gradient(90deg,#38bdf8,#818cf8);border-radius:4px"></div></div></div>';
  });
  var total=vals.reduce(function(a,b){ return a+b; },0);
  var settled=SUPPLIERS.reduce(function(a,s){ return a+s.payments.filter(function(p){ return isSettled(p.status); }).length; },0);
  var ccySet=[]; SUPPLIERS.forEach(function(s){ if(ccySet.indexOf(s.ccy)<0) ccySet.push(s.ccy); });
  var fwds=SUPPLIERS.reduce(function(a,s){ return a+s.payments.filter(function(p){ return isHedged(p.status)&&isVisible(p.status); }).length; },0);
  var html='<div style="display:grid;gap:14px">';
  html+='<div class="card" style="padding:16px"><div style="font-size:14px;font-weight:600;margin-bottom:4px">Projected GBP Outflows</div>';
  html+='<div style="font-size:11px;color:#64748b;margin-bottom:16px">Outstanding payments by month</div>';
  html+=(bars||'<div style="color:#475569;font-size:12px">No outstanding payments</div>');
  html+='<div style="display:flex;justify-content:space-between;padding:10px 0 0;border-top:2px solid #ffffff12">';
  html+='<span style="font-weight:700">Total Outstanding</span><span class="mono" style="font-weight:700;font-size:15px;color:#38bdf8">GBP '+fmt(total)+'</span></div></div>';
  html+='<div class="card" style="padding:16px"><div style="font-size:13px;font-weight:600;margin-bottom:10px;color:#38bdf8">Relationship Summary</div>';
  html+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px">';
  [{l:"Payments Settled",v:settled},{l:"Currencies Traded",v:ccySet.join(", ")},{l:"Suppliers Managed",v:SUPPLIERS.length},{l:"Hedged Positions",v:fwds}].forEach(function(x){
    html+='<div><div style="font-size:10px;color:#475569;margin-bottom:2px">'+x.l+'</div><div style="font-size:16px;font-weight:700">'+x.v+'</div></div>';
  });
  html+='</div></div></div>';
  return html;
}

function renderCurrency(d) {
  var html='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px">';
  if (!Object.keys(d.cc).length) {
    return '<div class="card" style="padding:40px;text-align:center;color:#475569;font-size:13px">No active payments. Toggle "Settled hidden" off to view history.</div>';
  }
  Object.keys(d.cc).forEach(function(c){
    var v=d.cc[c];
    var pD=v.total>0?((v.settled/v.total)*100).toFixed(0):"0";
    var pF=v.total>0?((v.fwd/v.total)*100).toFixed(0):"0";
    var pU=v.total>0?((v.unhedged/v.total)*100).toFixed(0):"0";
    html+='<div class="card" style="padding:16px">';
    html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">';
    html+='<div style="width:32px;height:32px;border-radius:6px;background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#94a3b8">'+c+'</div>';
    html+='<div><div style="font-size:17px;font-weight:700">'+c+'</div><div style="font-size:11px;color:#475569">GBP/'+c+'</div></div>';
    html+='<div style="margin-left:auto"><div style="font-size:18px;font-weight:700">GBP '+fmt(v.total)+'</div></div></div>';
    html+='<div style="height:8px;border-radius:4px;background:#0f172a;display:flex;overflow:hidden;margin-bottom:10px">';
    html+='<div style="width:'+pD+'%;background:#22c55e"></div><div style="width:'+pF+'%;background:#f59e0b"></div><div style="width:'+pU+'%;background:#ef4444"></div></div>';
    html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px">';
    [{l:"Settled",v:v.settled,c:"#22c55e",p:pD},{l:"Hedged",v:v.fwd,c:"#f59e0b",p:pF},{l:"Open",v:v.unhedged,c:"#ef4444",p:pU}].forEach(function(x){
      html+='<div style="text-align:center"><div style="font-size:10px;color:#475569">'+x.l+'</div><div style="font-size:13px;font-weight:600;color:'+x.c+'">GBP '+fmt(x.v)+'</div><div style="font-size:9px;color:#475569">'+x.p+'%</div></div>';
    });
    html+='</div>';
    if (d.wavg[c]) {
      html+='<div style="background:#0f172a;border-radius:6px;padding:8px 10px;font-size:11px">';
      html+='<div style="display:flex;justify-content:space-between"><span style="color:#94a3b8">Wt Avg</span><span class="mono" style="font-weight:600">'+fmtD(d.wavg[c],4)+'</span></div>';
      html+='<div style="display:flex;justify-content:space-between;margin-top:2px"><span style="color:#94a3b8">Spot</span><span class="mono" style="color:#64748b">'+fmtD(SPOT[c],4)+'</span></div></div>';
    }
    html+='<div style="margin-top:8px;font-size:10px;color:#475569">'+SUPPLIERS.filter(function(s){ return s.ccy===c; }).map(function(s){ return s.name; }).join(", ")+'</div>';
    html+='</div>';
  });
  html+='</div>';
  return html;
}

function renderLog() {
  if (CHANGE_LOG === null) {
    return '<div class="card" style="padding:40px;text-align:center">' +
      '<div style="color:#475569;font-size:13px">Loading audit log...</div></div>';
  }
  var pMap = buildPaymentMap();
  var html = '<div class="card" style="overflow:hidden">';
  html += '<div style="padding:14px 16px;border-bottom:1px solid #ffffff08;display:flex;justify-content:space-between;align-items:center">';
  html += '<div><div style="font-size:14px;font-weight:600">Audit Log</div>';
  html += '<div style="font-size:11px;color:#64748b;margin-top:2px">All manual changes to payment records — newest first</div></div>';
  html += '<button onclick="refreshLog()" style="padding:5px 12px;border-radius:5px;border:1px solid #334155;background:transparent;color:#64748b;font-size:11px;cursor:pointer;font-family:\'DM Sans\',sans-serif">&#8635; Refresh</button>';
  html += '</div>';
  if (CHANGE_LOG.length === 0) {
    html += '<div style="padding:40px;text-align:center;color:#475569;font-size:13px">No changes recorded yet.</div></div>';
    return html;
  }
  html += '<div style="overflow-x:auto"><table style="min-width:700px"><thead><tr>';
  html += '<th>When</th><th>User</th><th>Supplier</th><th>Ref</th><th>Changes</th><th>Note</th>';
  html += '</tr></thead><tbody>';
  CHANGE_LOG.forEach(function(row) {
    var payment  = pMap[row.payment_id] || {};
    var supplier = payment.supplier || '<span style="color:#475569">unknown</span>';
    var ref      = payment.ref      || '<span class="mono" style="font-size:9px;color:#334155">'+(row.payment_id||"--")+'</span>';
    var changes  = row.changes;
    if (typeof changes === "string") { try { changes = JSON.parse(changes); } catch(e) { changes = null; } }
    var user = (row.changed_by || "unknown").replace(/@.*$/, "");
    html += '<tr>';
    html += '<td class="mono" style="font-size:11px;color:#64748b;white-space:nowrap">'+fmtDateTime(row.created_at)+'</td>';
    html += '<td style="font-size:12px;font-weight:500;color:#94a3b8;white-space:nowrap">'+user+'</td>';
    html += '<td style="font-size:12px;font-weight:500">'+supplier+'</td>';
    html += '<td class="mono" style="font-size:11px;color:#94a3b8">'+ref+'</td>';
    html += '<td style="max-width:320px">'+renderChangePills(changes)+'</td>';
    html += '<td style="font-size:11px;color:#64748b;font-style:'+(row.note?"normal":"italic")+'">'+(row.note||'<span style="color:#334155">—</span>')+'</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div style="padding:10px 16px;border-top:1px solid #ffffff08;display:flex;justify-content:flex-end">';
  html += '<span style="font-size:10px;color:#334155">'+CHANGE_LOG.length+' record'+(CHANGE_LOG.length!==1?"s":"")+'</span>';
  html += '</div></div>';
  return html;
}

// ── AUTH ──────────────────────────────────────────────────────────────────

function doLogin() {
  var email=document.getElementById("em").value;
  var pw=document.getElementById("pw").value;
  var btn=document.getElementById("login-btn");
  var err=document.getElementById("login-err");
  btn.textContent="Signing in..."; btn.disabled=true; err.style.display="none";
  fetch(SB_URL+"/auth/v1/token?grant_type=password",{
    method:"POST",
    headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({email:email,password:pw})
  }).then(function(r){ return r.json(); }).then(function(data){
    if (data.access_token) {
      sessionStorage.setItem("sb_token",   data.access_token);
      sessionStorage.setItem("sb_refresh", data.refresh_token);
      try { var pl=JSON.parse(atob(data.access_token.split(".")[1])); CURRENT_USER=pl.email||email; } catch(e){ CURRENT_USER=email; }
      loadDashboard();
    } else {
      err.textContent=data.error_description||"Invalid email or password";
      err.style.display="block"; btn.textContent="Sign in"; btn.disabled=false;
    }
  }).catch(function(){
    err.textContent="Connection error. Please try again.";
    err.style.display="block"; btn.textContent="Sign in"; btn.disabled=false;
  });
}

document.addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });

function loadDashboard() {
  document.getElementById("login").style.display="none";
  document.getElementById("loading").style.display="flex";
  Promise.all([
    fetchSpotRates(),
    sbFetch("suppliers?client_id=eq.flooglebinder&order=name"),
    sbFetch("payments?client_id=eq.flooglebinder&order=due_date")
  ]).then(function(results){
    SUPPLIERS = buildSuppliers(results[1], results[2]);
    document.getElementById("loading").style.display="none";
    document.getElementById("app").style.display="block";
    if (!CURRENT_USER) {
      try { var t=getToken(); var pl=JSON.parse(atob(t.split(".")[1])); CURRENT_USER=pl.email||""; } catch(e){}
    }
    render();
    setInterval(function() {
      fetchSpotRates().then(function() {
        if (document.getElementById("app").style.display === "block") render();
      });
    }, 15 * 60 * 1000);
  }).catch(function(e){
    document.getElementById("loading").innerHTML=
      '<div style="color:#ef4444;font-size:14px;font-weight:600">Could not load data</div>'+
      '<div style="color:#64748b;font-size:12px">'+e.message+'</div>';
  });
}

if (sessionStorage.getItem("sb_token")) {
  loadDashboard();
} else {
  document.getElementById("login").style.display="flex";
}
</script>
